name: SCELE Assignments Checker

on:
  schedule:
    # Avoid :00, when GitHub's shared scheduler is busiest.
    # 05:07 UTC = 12.07 WIB; 17:07 UTC = 00.07 WIB on the next local day.
    - cron: "7 5 * * *"
    - cron: "7 17 * * *"
    # 03:07 UTC = 10.07 WIB, for the persistent deadline-today message.
    - cron: "7 3 * * *"
  workflow_dispatch:
    inputs:
      activate:
        description: "Activate the bot once and create its two persistent Discord messages"
        required: false
        default: "OFF"
        type: choice
        options:
          - "OFF"
          - "ON"
      tester:
        description: "TESTER mode: sends production-format test notifications without changing state"
        required: false
        default: "OFF"
        type: choice
        options:
          - "OFF"
          - "ON"
      update_now:
        description: "Update both existing persistent Discord messages now"
        required: false
        default: "OFF"
        type: choice
        options:
          - "OFF"
          - "ON"

permissions:
  contents: write

concurrency:
  group: scele-discord-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out state
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check SCELE and notify Discord
        env:
          SCELE_USERNAME: ${{ secrets.SCELE_USERNAME }}
          SCELE_PASSWORD: ${{ secrets.SCELE_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTIVATE: ${{ inputs.activate || 'OFF' }}
          TESTER: ${{ inputs.tester || 'OFF' }}
          MANUAL_UPDATE: ${{ inputs.update_now || 'OFF' }}
          # Keeps the intended update type even when the runner starts late.
          SCHEDULE_TRIGGER: ${{ github.event.schedule }}
        run: python -m bot.main

      - name: Persist notification state
        if: always()
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update notifier state"
            git push
          fi
